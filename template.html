<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — feature map</title>
<style>
  :root {
    --ink: #2b2140;
    --soft: #6b6580;
    --faint: #b0a9c2;
    --card: #ffffff;
    --well: #f7f5fd;
    --line: #e7e0f5;
    --shadow: 0 10px 30px rgba(70, 50, 120, .12);
    --purple: #6b4fd0;
    --lav: #efe9ff;
    --b-now: #2ea88a;
    --b-blocked: #e04f66;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    margin: 0; padding: 24px 16px 64px;
    font-family: ui-rounded, "Segoe UI", Nunito, system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, #fff4e6 0%, #ffe9f3 45%, #e9f0ff 100%);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 26px; }
  h1 { font-size: 30px; font-weight: 800; letter-spacing: -.5px; line-height: 1.15; }
  .sub { color: var(--soft); margin-top: 6px; font-size: 15px; }
  .sub a { color: var(--purple); font-weight: 700; text-decoration: none; }
  .stamp { color: var(--faint); font-size: 12.5px; margin-top: 6px; }
  .reco { display: inline-block; background: var(--lav); border-radius: 999px; padding: 4px 14px; font-size: 13px; font-weight: 700; color: var(--purple); margin-top: 8px; }

  h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 2px;
    color: var(--soft); margin: 32px 0 12px; text-align: center;
  }

  .feat {
    background: var(--card); border-radius: 22px; padding: 20px 20px;
    box-shadow: var(--shadow); border-top: 4px solid var(--purple); margin: 14px 0;
  }
  .feat h3 { font-size: 18px; font-weight: 800; margin-bottom: 2px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .feat h3 .from { font-size: 12px; font-weight: 700; color: var(--faint); text-transform: uppercase; letter-spacing: 1px; }
  .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--faint); margin: 14px 0 6px; }
  .kv { font-size: 14.5px; line-height: 1.55; margin: 4px 0; }
  .kv b { color: var(--purple); }

  .life { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .life .pill {
    background: var(--well); border: 2px solid var(--line);
    border-radius: 999px; padding: 6px 13px; font-size: 13px; font-weight: 700;
  }
  .life .pill.trig { border-color: #c9b8f2; background: var(--lav); color: var(--purple); }
  .life .pill.end { border-color: rgba(224, 79, 102, .35); color: var(--b-blocked); }
  .life .arr { color: var(--faint); font-weight: 800; }

  ol.steps { margin-left: 20px; font-size: 14.5px; }
  ol.steps li { margin: 4px 0; }
  ol.steps li::marker { color: var(--purple); font-weight: 800; }

  .verdict {
    border-radius: 14px; padding: 12px 16px; margin: 8px 0; font-size: 14.5px; line-height: 1.5;
  }
  .verdict span { font-weight: 800; display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 3px; }
  .verdict.ok { background: rgba(46, 168, 138, .07); border: 2px solid rgba(46, 168, 138, .35); }
  .verdict.ok span { color: var(--b-now); }
  .verdict.bad { background: rgba(224, 79, 102, .06); border: 2px dashed rgba(224, 79, 102, .35); }
  .verdict.bad span { color: var(--b-blocked); }

  footer { text-align: center; color: var(--soft); font-size: 13px; margin-top: 40px; }
  footer a { color: var(--purple); font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>{{TITLE}}</h1>
    <div class="sub">feature map for <a href="{{SOURCE_URL}}">{{SOURCE_LABEL}}</a></div>
    <div class="reco">{{COUNT}}</div>
    <div class="stamp">feature-map · updated {{UPDATED}} · verified from the user's side</div>
  </header>

  {{FEATURES}}

  <footer>Source of truth: <a href="{{SOURCE_URL}}">the idea-slicer map</a> · <a href="index.html">all feature maps</a></footer>

</div>
<script src="nav.js" defer></script>
</body>
</html>
